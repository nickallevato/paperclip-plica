name: release

# Publishes `paperclip-plugin-tickler` to npm — on a merge to `main` that is
# worth a version, or when a `v*` tag lands on the repo.
#
# A merge is the release (PLI-251). The `plan` job reads the conventional-commit
# subjects since the last tag; if any of them is a feat, fix, perf or revert,
# `cut` writes the version into the tree, commits it to `main` and tags it, and
# `publish` runs on that tag. A merge carrying only chores, docs, CI or a
# refactor publishes nothing and spends no version number. The alternative was
# a human deciding when a version is worth shipping, which is what let the
# 0.8.0 self-update button sit finished on `main` with nothing to prompt the tag
# (PLI-249).
#
# The cut happens in *this* workflow rather than in a job that pushes a tag for
# `release.yml` to pick up, for two reasons that both have to hold: a push made
# with `GITHUB_TOKEN` does not trigger another workflow, so the tag would land
# and nothing would publish; and npm's trusted-publisher entry matches this
# file's name, so the publish has to happen from `release.yml` or the registry
# refuses it. Moving the publish step to another workflow means re-entering the
# trusted publisher on npmjs.com.
#
# Nothing here decides the version out of nowhere and nothing here writes prose:
# `scripts/plan-release.mjs` derives the number from the merge subjects,
# `scripts/apply-release.mjs` performs the same edits "Cutting a release" used to
# ask a person for, `scripts/check-release.mjs` refuses a version that is
# declared inconsistently, and `scripts/publish-npm.mjs` is the same script a
# person would run by hand.
#
# The workspace layout and the Paperclip core checkout are the same trick
# `ci.yml` uses and are explained there — Tickler's `@paperclipai/*` dev
# dependencies are `link:../../paperclip/...`, so nothing installs or type-checks
# without a core tree next to this one. The setup steps below are a deliberate
# copy of that job rather than a shared composite action: a release must not
# start failing because a refactor of the CI job drifted. Keep them in step.
#
# `workflow_dispatch` exists for the rehearsal — a dry run packs the tarball,
# runs every check, and publishes nothing.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (leave blank to only rehearse the default branch)
        required: false
      dry-run:
        description: Pack and check, publish nothing
        type: boolean
        default: true

permissions:
  # `cut` pushes the release commit and its tag to `main`. CONTRIBUTING.md's
  # "never push to `main` directly" is a rule for people; this is the one writer
  # that is allowed to, it only ever writes a `chore(release):` commit, and that
  # commit plans no release of its own so it cannot loop.
  contents: write
  # npm trusted publishing authenticates with this, and it is also what makes
  # `--provenance` possible. Without it, publishing needs the NPM_TOKEN secret.
  id-token: write

concurrency:
  # One publish at a time, and never cancelled halfway: a tarball that reached
  # the registry cannot be taken back, so an interrupted job is the one thing
  # worse than a slow one. Keyed on the workflow rather than the ref now that a
  # branch push can also release — two merges landing together must queue, not
  # race each other to the same version number.
  group: release-${{ github.workflow }}
  cancel-in-progress: false

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  plan:
    name: plan the release
    runs-on: ubuntu-latest
    # Only a merge to `main` needs planning. A tag push already names its
    # version, and a dispatch is a rehearsal or a retry of one.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The plan is a range against the last `v*` tag, so the tags and the
          # history behind them both have to be here.
          fetch-depth: 0

      # No setup-node, no install: the planner is dependency-free on purpose, so
      # the decision to publish is made before anything can fail to install.
      - name: Decide whether this merge is a release
        id: plan
        run: node scripts/plan-release.mjs --github-output

  cut:
    name: cut ${{ needs.plan.outputs.version }}
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write the version into the tree
        run: |
          node scripts/apply-release.mjs --version "${{ needs.plan.outputs.version }}"
          node scripts/check-release.mjs --tag "${{ needs.plan.outputs.tag }}"

      # Attributed to the Actions bot rather than to whoever's merge triggered
      # it: the commit is this workflow's, and signing it as a person would put
      # their name on text they did not write.
      - name: Commit and tag
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): $VERSION"
          git tag -a "$TAG" -m "Tickler $VERSION"

      # `--atomic` so the branch and the tag land together or not at all: a tag
      # without its commit on `main` is a release nobody can check out, and a
      # commit without its tag is a version that never publishes.
      #
      # Pushing the branch, not force-pushing it. If another merge landed while
      # this ran the push is refused, this run fails having published nothing,
      # and that merge's own run re-plans from the newer `main` — the version
      # number is only spent when npm accepts a tarball, so nothing is lost.
      - name: Push the release commit and tag
        run: git push --atomic origin HEAD:main "${{ needs.plan.outputs.tag }}"

  publish:
    name: publish to npm
    needs: [plan, cut]
    # Runs for a tag push and a dispatch, where `plan` and `cut` are both
    # skipped, and for a merge only once `cut` has landed the tag. `!failure()`
    # and `!cancelled()` are what let a skipped dependency through without
    # letting a broken one through.
    if: >-
      !failure() && !cancelled() &&
      (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' ||
       needs.plan.outputs.release == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Check out Tickler
        uses: actions/checkout@v4
        with:
          path: repo/tickler
          # Tags are what the version check compares against, and a dispatch run
          # is handed a branch, so fetch them regardless of what triggered this.
          fetch-depth: 0
          # The tag `cut` just pushed, the one a dispatch names, or the tag that
          # triggered this. Never `main` on a merge: the commit `cut` made is
          # what gets published, not whatever `main` has moved on to.
          ref: ${{ needs.plan.outputs.tag || inputs.tag || github.ref }}

      - name: Read the pinned Paperclip core commit
        id: core
        working-directory: repo/tickler
        run: |
          ref=$(grep -v '^[[:space:]]*#' .github/paperclip-core.ref | tr -d '[:space:]')
          if [ -z "$ref" ]; then
            echo "::error::.github/paperclip-core.ref holds no commit SHA"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Paperclip core pinned at $ref"

      - name: Check out Paperclip core (read-only reference)
        uses: actions/checkout@v4
        with:
          repository: paperclipai/paperclip
          ref: ${{ steps.core.outputs.ref }}
          path: paperclip

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # Deliberately no `registry-url`: that writes an .npmrc wired to
          # NODE_AUTH_TOKEN, which fails closed when the secret is unset instead
          # of letting npm find the OIDC credential. publish-npm.mjs decides.

      - name: Enable corepack
        run: corepack enable

      - name: Install Paperclip core packages
        working-directory: paperclip
        run: pnpm install --frozen-lockfile --ignore-scripts --filter "@paperclipai/plugin-sdk..." --filter "@paperclipai/shared..."

      - name: Build the plugin SDK
        working-directory: paperclip
        run: pnpm --filter @paperclipai/plugin-sdk build

      - name: Install Tickler
        working-directory: repo/tickler
        run: pnpm install --frozen-lockfile

      # No typecheck/build/test step: `npm publish` runs `prepublishOnly`, which
      # is all three, so a red tree cannot reach the registry and a dry run
      # exercises the same pipeline the real publish will.
      # The arguments are assembled in the shell rather than in a nested
      # `${{ }}` ternary, which is unreadable and untestable in equal measure.
      - name: Publish
        working-directory: repo/tickler
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag || (github.ref_type == 'tag' && github.ref_name) || inputs.tag }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          args=()
          if [ -n "$RELEASE_TAG" ]; then args+=(--tag "$RELEASE_TAG"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node scripts/publish-npm.mjs "${args[@]}"

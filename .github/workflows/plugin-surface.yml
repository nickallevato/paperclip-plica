name: plugin surface

# The no-core-changes rule, enforced. See CONTRIBUTING.md, "Never modify
# Paperclip core".
#
# Deliberately does not install dependencies. `ci.yml` does the heavy work —
# it clones a Paperclip checkout so the `@paperclipai/*` links resolve — but
# this check is plain Node against plain git, so it still reports in seconds
# when that install or build is broken. Those are the moments a core edit is
# most tempting, so the guardrail must not depend on them.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plugin-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the merge base to diff a PR branch against it.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the changed files stay inside the plugin surface
        if: github.event_name == 'pull_request'
        run: node scripts/check-plugin-surface.mjs --base "origin/${{ github.base_ref }}"

      - name: Check the whole tree stays inside the plugin surface
        if: github.event_name != 'pull_request'
        run: node scripts/check-plugin-surface.mjs --all
